; 单容器里同时管 postgres 和 api 两个常驻进程。
; 日志都打到 stdout/stderr，`docker logs` 能看到两边的输出。
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:postgres]
command=/app/docker/postgres-entrypoint.sh
priority=1
autostart=true
autorestart=true
stopsignal=INT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
command=/app/docker/api-entrypoint.sh
priority=2
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
