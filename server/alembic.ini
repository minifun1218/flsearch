# Alembic 配置。数据库地址不写在这里 —— migrations/env.py 从 app.config 读 DATABASE_URL，
# 保证迁移和应用永远指向同一个库。

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# 版本号用时间前缀，多人协作时文件顺序一眼可读。
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
