<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; background: #FBFAF7; color: #23201C;
      font-family: "Noto Sans SC", system-ui, -apple-system, sans-serif;
      font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    a { color: #4A6B4F; text-decoration: none; } a:hover { color: #3A553D; }
    .n { font-family: Archivo, system-ui, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBFAF7;">

  <!-- 背景：被遮住的首页 -->
  <div style="padding: 52px 20px 0 20px; opacity: 0.5;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;">
      <div class="n" style="font-size: 20px; font-weight: 600;">9月16日</div>
      <div style="padding: 6px 12px; border-radius: 999px; background: #EDF1EC; color: #4A6B4F; font-size: 12px;">训练日</div>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #EFEBE4; border-radius: 18px; padding: 26px 22px; display: flex; align-items: center; justify-content: center; height: 188px; box-sizing: content-box;">
      <svg width="188" height="188" viewBox="0 0 188 188">
        <circle cx="94" cy="94" r="80" fill="none" stroke="#F2EFE9" stroke-width="15"></circle>
        <circle cx="94" cy="94" r="80" fill="none" stroke="#23201C" stroke-width="15" stroke-linecap="round" stroke-dasharray="366 503" transform="rotate(-90 94 94)"></circle>
      </svg>
    </div>
  </div>

  <!-- 遮罩 -->
  <div style="position: absolute; inset: 0; background: rgba(23,22,20,0.45);"></div>

  <!-- 弹窗 -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FBFAF7; border-radius: 26px 26px 0 0; padding: 12px 24px 38px 24px; box-sizing: border-box;">

    <div style="width: 38px; height: 4px; border-radius: 2px; background: #DCD6CB; margin: 0 auto 26px auto;"></div>

    <div style="width: 52px; height: 52px; border-radius: 16px; background: #F0ECE4; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#23201C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2.5"></rect><path d="M3 15l5-4 4 3 3-2 6 4"></path><circle cx="15.5" cy="9.5" r="1.4"></circle></svg>
    </div>

    <div style="font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.35;">照片会发到云端识别</div>
    <div style="font-size: 14px; color: #6B655C; line-height: 1.7; margin-top: 10px;">识别在服务器上完成，需要把这张照片交给第三方 AI 服务。开始之前想让你知道这几件事。</div>

    <div style="display: flex; flex-direction: column; gap: 18px; margin: 26px 0 0 0;">

      <div style="display: flex; gap: 13px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#4A6B4F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px;"><path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6l7-3z"></path><path d="M9.2 12l2 2 3.6-3.8"></path></svg>
        <div>
          <div style="font-size: 14px; font-weight: 500;">只用来认食物</div>
          <div style="font-size: 12.5px; color: #6B655C; line-height: 1.6; margin-top: 3px;">照片不会用于训练模型，也不会出现在任何公开的地方。</div>
        </div>
      </div>

      <div style="display: flex; gap: 13px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#4A6B4F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5V12l3 2"></path></svg>
        <div>
          <div style="font-size: 14px; font-weight: 500;">30 天后自动删除</div>
          <div style="font-size: 12.5px; color: #6B655C; line-height: 1.6; margin-top: 3px;">识别完成后照片还留 30 天方便你回看，到期服务器自动清理。</div>
        </div>
      </div>

      <div style="display: flex; gap: 13px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#4A6B4F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px;"><path d="M4 7h16M4 12h10M4 17h13"></path></svg>
        <div>
          <div style="font-size: 14px; font-weight: 500;">不同意也能用</div>
          <div style="font-size: 12.5px; color: #6B655C; line-height: 1.6; margin-top: 3px;">手动搜索、常吃食物、复制历史餐都不需要上传任何照片。</div>
        </div>
      </div>

    </div>

    <div style="margin-top: 26px; padding-top: 18px; border-top: 1px solid #EFEBE4;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 13px; color: #6B655C;">完整说明</span>
        <div style="display: flex; align-items: center; gap: 4px;">
          <span style="font-size: 13px; color: #23201C; font-weight: 500;">隐私政策</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#23201C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 22px;">
      <div style="height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 15px; background: #23201C; color: #FBFAF7; font-size: 15px; font-weight: 500;">同意，开始识别</div>
      <div style="height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 15px; border: 1px solid #DCD6CB; color: #3A3630; font-size: 15px;">不同意，改用手动记录</div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
