<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; background: #FBFAF7; color: #23201C;
      font-family: "Noto Sans SC", system-ui, -apple-system, sans-serif;
      font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    a { color: #4A6B4F; text-decoration: none; } a:hover { color: #3A553D; }
    .n { font-family: Archivo, system-ui, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
    .tap { cursor: pointer; user-select: none;
      transition: background-color .18s ease, color .18s ease, border-color .18s ease, transform .09s ease; }
    .tap:active { transform: scale(0.98); }
    .val { transition: color .18s ease; }
  </style>
</helmet>

<div style="width: 390px; padding: 52px 0 0 0; box-sizing: border-box;">

  <div style="padding: 0 28px;">
    <div style="display: flex; align-items: center; gap: 6px;">
      <div style="flex-grow: 1; height: 3px; border-radius: 2px; background: #23201C;"></div>
      <div style="flex-grow: 1; height: 3px; border-radius: 2px; background: #E6E2DA;"></div>
      <div style="flex-grow: 1; height: 3px; border-radius: 2px; background: #E6E2DA;"></div>
    </div>
    <div class="n" style="font-size: 11px; color: #9A948A; margin-top: 10px;">1 / 3</div>
  </div>

  <div style="padding: 26px 28px 0 28px;">
    <div style="font-size: 27px; font-weight: 700; line-height: 1.32; letter-spacing: -0.025em;">先了解一下你</div>
    <div style="font-size: 14px; color: #6B655C; line-height: 1.65; margin-top: 10px;">这些数据只用来计算你的每日目标，可以随时改。</div>
  </div>

  <div style="padding: 32px 28px 0 28px;">
    <div style="font-size: 12px; color: #9A948A; margin-bottom: 10px;">生理性别</div>
    <div style="display: flex; gap: 10px;">
      <div class="tap" onClick="{{sex.pickMale}}" style="{{sex.male}}">男</div>
      <div class="tap" onClick="{{sex.pickFemale}}" style="{{sex.female}}">女</div>
    </div>
    <div style="font-size: 11px; color: #B5AB9C; margin-top: 8px;">基础代谢公式需要，不影响其他功能</div>
  </div>

  <div style="padding: 26px 28px 0 28px; display: flex; flex-direction: column; gap: 10px;">

    <div class="tap" style="display: flex; align-items: center; justify-content: space-between; background: #FFFFFF; border: 1px solid #E6E2DA; border-radius: 14px; padding: 15px 18px;">
      <span style="font-size: 15px;">出生日期</span>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="n" style="font-size: 15px; font-weight: 500;">1995-03-01</span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#B5AB9C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </div>
    </div>

    <div class="tap" style="display: flex; align-items: center; justify-content: space-between; background: #FFFFFF; border: 1px solid #E6E2DA; border-radius: 14px; padding: 15px 18px;">
      <span style="font-size: 15px;">身高</span>
      <div style="display: flex; align-items: baseline; gap: 4px;">
        <span class="n" style="font-size: 19px; font-weight: 600;">175</span>
        <span style="font-size: 13px; color: #9A948A;">cm</span>
      </div>
    </div>

    <div class="tap" style="display: flex; align-items: center; justify-content: space-between; background: #FFFFFF; border: 1.5px solid #23201C; border-radius: 14px; padding: 15px 18px;">
      <span style="font-size: 15px;">当前体重</span>
      <div style="display: flex; align-items: baseline; gap: 4px;">
        <span class="n" style="font-size: 19px; font-weight: 600;">72.5</span>
        <span style="font-size: 13px; color: #9A948A;">kg</span>
      </div>
    </div>

    <div class="tap" onClick="{{toggleBf}}" style="{{bf.boxStyle}}">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 15px;">体脂率</span>
          <span style="{{bf.tagStyle}}">{{bf.tag}}</span>
        </div>
        <div style="display: flex; align-items: baseline; gap: 4px;">
          <span class="n val" style="{{bf.valueStyle}}">{{bf.value}}</span>
          <span style="font-size: 13px; color: #9A948A;">%</span>
        </div>
      </div>
      <div style="font-size: 11px; color: #B5AB9C; margin-top: 7px; line-height: 1.6;">{{bf.hint}}</div>
    </div>

  </div>

  <!-- 实时 BMR -->
  <div style="margin: 20px 28px 0 28px; background: #23201C; border-radius: 16px; padding: 18px 20px; color: #FBFAF7;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <span style="font-size: 12px; color: rgba(251,250,247,0.55);">基础代谢 BMR</span>
      <span class="n val" style="font-size: 24px; font-weight: 600;">{{bmr}}<span style="font-size: 12px; font-weight: 400; color: rgba(251,250,247,0.55);"> kcal</span></span>
    </div>
    <div class="n" style="font-size: 11px; color: rgba(251,250,247,0.45); margin-top: 8px; line-height: 1.6;">{{formula}}</div>
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(251,250,247,0.13);">
      <span style="font-size: 12px; color: rgba(251,250,247,0.55);">× {{factor}} 得每日总消耗</span>
      <span class="n val" style="font-size: 17px; font-weight: 600;">{{tdee}}<span style="font-size: 11px; font-weight: 400; color: rgba(251,250,247,0.55);"> kcal</span></span>
    </div>
  </div>

  <div style="padding: 26px 28px 0 28px;">
    <div style="font-size: 12px; color: #9A948A; margin-bottom: 10px;">日常活动水平<span style="color: #B5AB9C;">（不含训练）</span></div>
    <div style="display: flex; flex-direction: column; gap: 9px;">
      <sc-for list="{{levels}}" as="lv" hint-placeholder-count="4">
        <div class="tap" onClick="{{lv.pick}}" style="{{lv.boxStyle}}">
          <div style="{{lv.radioStyle}}">
            <sc-if value="{{lv.on}}" hint-placeholder-val="{{false}}">
              <div style="width: 6px; height: 6px; border-radius: 50%; background: #FBFAF7;"></div>
            </sc-if>
          </div>
          <div>
            <div style="{{lv.nameStyle}}">{{lv.name}}</div>
            <div style="font-size: 11px; color: #9A948A; margin-top: 2px;">{{lv.desc}}</div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="padding: 30px 28px 38px 28px;">
    <div class="tap" style="height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 15px; background: #23201C; color: #FBFAF7; font-size: 15px; font-weight: 500;">下一步：训练安排</div>
  </div>

</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sex: 'male', bodyFat: null, level: 2 };
  }

  renderVals() {
    const self = this;
    const st = this.state;
    const W = 72.5, H = 175, AGE = 31;

    const LEVELS = [
      { name: '久坐',     desc: '办公室工作，几乎不走动',   f: 1.2 },
      { name: '轻度活动', desc: '每天走动 30 分钟左右',     f: 1.375 },
      { name: '中度活动', desc: '常走动或站立工作',         f: 1.55 },
      { name: '重体力',   desc: '体力劳动或长时间行走',     f: 1.725 }
    ];

    let bmr, formula;
    if (st.bodyFat !== null) {
      const lean = W * (1 - st.bodyFat / 100);
      bmr = Math.round(370 + 21.6 * lean);
      formula = 'Katch-McArdle：370 + 21.6 × ' + lean.toFixed(2) + ' 去脂体重';
    } else {
      const base = 10 * W + 6.25 * H - 5 * AGE;
      bmr = Math.round(st.sex === 'male' ? base + 5 : base - 161);
      formula = 'Mifflin-St Jeor：10×72.5 + 6.25×175 − 5×31 ' + (st.sex === 'male' ? '+ 5' : '− 161');
    }

    const factor = LEVELS[st.level].f;

    const SEG_ON = 'flex-grow: 1; height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #23201C; color: #FBFAF7; font-size: 15px; font-weight: 500; border: 1px solid #23201C;';
    const SEG_OFF = 'flex-grow: 1; height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #FFFFFF; border: 1px solid #E6E2DA; color: #6B655C; font-size: 15px;';

    const L_ON = 'display: flex; align-items: center; gap: 13px; background: #FFFFFF; border: 1.5px solid #23201C; border-radius: 14px; padding: 14px 16px;';
    const L_OFF = 'display: flex; align-items: center; gap: 13px; background: #FFFFFF; border: 1px solid #E6E2DA; border-radius: 14px; padding: 14px 16px;';

    const levels = LEVELS.map(function (lv, i) {
      const on = st.level === i;
      return {
        name: lv.name,
        desc: on ? (lv.desc + ' · 系数 ' + lv.f) : lv.desc,
        on: on,
        boxStyle: on ? L_ON : L_OFF,
        nameStyle: on ? 'font-size: 14px; font-weight: 500;' : 'font-size: 14px;',
        radioStyle: on
          ? 'width: 19px; height: 19px; border-radius: 50%; background: #23201C; display: flex; align-items: center; justify-content: center; flex-shrink: 0;'
          : 'width: 19px; height: 19px; border-radius: 50%; border: 1.6px solid #DCD6CB; flex-shrink: 0; box-sizing: border-box;',
        pick: function () { self.setState({ level: i }); }
      };
    });

    const filled = st.bodyFat !== null;

    return {
      sex: {
        male: st.sex === 'male' ? SEG_ON : SEG_OFF,
        female: st.sex === 'female' ? SEG_ON : SEG_OFF,
        pickMale: function () { self.setState({ sex: 'male' }); },
        pickFemale: function () { self.setState({ sex: 'female' }); }
      },
      bf: {
        value: filled ? st.bodyFat : '——',
        valueStyle: filled
          ? 'font-size: 19px; font-weight: 600; color: #23201C;'
          : 'font-size: 19px; font-weight: 600; color: #B5AB9C;',
        tag: filled ? '已填' : '选填',
        tagStyle: filled
          ? 'padding: 2px 7px; border-radius: 6px; background: #EDF1EC; color: #4A6B4F; font-size: 10px; font-weight: 500;'
          : 'padding: 2px 7px; border-radius: 6px; background: #F2EFE9; color: #9A948A; font-size: 10px;',
        boxStyle: filled
          ? 'background: #FFFFFF; border: 1.5px solid #23201C; border-radius: 14px; padding: 15px 18px;'
          : 'background: #FFFFFF; border: 1px solid #E6E2DA; border-radius: 14px; padding: 15px 18px;',
        hint: filled
          ? '已换用 Katch-McArdle 公式，比按身高体重估更贴近你'
          : '填了会换用更准的 Katch-McArdle 公式算基础代谢'
      },
      toggleBf: function () { self.setState({ bodyFat: filled ? null : 18 }); },
      levels: levels,
      bmr: bmr,
      formula: formula,
      factor: factor,
      tdee: Math.round(bmr * factor)
    };
  }
}
</script>
</body>
</html>
