<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; background: #FBFAF7; color: #23201C;
      font-family: "Noto Sans SC", system-ui, -apple-system, sans-serif;
      font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    a { color: #4A6B4F; text-decoration: none; } a:hover { color: #3A553D; }
    .n { font-family: Archivo, system-ui, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
    .tap { cursor: pointer; user-select: none;
      transition: background-color .18s ease, color .18s ease, box-shadow .18s ease, transform .09s ease; }
    .tap:active { transform: scale(0.97); }
    .bar { transition: height .32s cubic-bezier(.2,.8,.2,1); }
    .fill { transition: width .32s cubic-bezier(.2,.8,.2,1); }
    .val { transition: color .18s ease; }
    .ring { transition: stroke-dasharray .4s cubic-bezier(.2,.8,.2,1); }
  </style>
</helmet>

<div style="width: 390px; padding: 52px 0 0 0; box-sizing: border-box;">

  <div style="padding: 0 20px 20px 20px;">
    <div style="font-size: 26px; font-weight: 700; letter-spacing: -0.025em;">统计</div>
  </div>

  <div style="margin: 0 20px; display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #F0ECE4;">
    <div class="tap" onClick="{{pick7}}" style="{{seg.d7}}">近 7 天</div>
    <div class="tap" onClick="{{pick30}}" style="{{seg.d30}}">近 30 天</div>
  </div>

  <!-- 热量柱状 -->
  <div style="margin: 16px 20px 0 20px; background: #FFFFFF; border: 1px solid #EFEBE4; border-radius: 18px; padding: 20px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px;">
      <span style="font-size: 14px; font-weight: 500;">每日热量</span>
      <div style="display: flex; align-items: baseline; gap: 5px;">
        <span class="n val" style="font-size: 20px; font-weight: 600;">{{avgKcal}}</span>
        <span style="font-size: 11px; color: #9A948A;">日均 kcal</span>
      </div>
    </div>

    <div style="position: relative; height: 138px;">
      <div style="position: absolute; top: 18px; left: 0; right: 0; height: 1px; border-top: 1px dashed #C9C2B6;"></div>
      <div class="n" style="position: absolute; top: 4px; right: 0; font-size: 10px; color: #9A948A;">日均目标 2037</div>

      <div style="{{gridStyle}}">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
          <div class="bar" style="{{b.style}}"></div>
        </sc-for>
      </div>

      <div style="{{labelGridStyle}}">
        <sc-for list="{{labels}}" as="l" hint-placeholder-count="7">
          <span style="{{l.style}}">{{l.text}}</span>
        </sc-for>
      </div>
    </div>
    <div style="font-size: 11px; color: #B5AB9C; margin-top: 4px;">{{missNote}}</div>
  </div>

  <!-- 达标率 -->
  <div style="margin: 12px 20px 0 20px; background: #FFFFFF; border: 1px solid #EFEBE4; border-radius: 18px; padding: 22px 20px;">
    <div style="display: flex; align-items: center; gap: 22px;">
      <div style="position: relative; width: 104px; height: 104px; flex-shrink: 0;">
        <svg width="104" height="104" viewBox="0 0 104 104">
          <circle cx="52" cy="52" r="44" fill="none" stroke="#F2EFE9" stroke-width="10"></circle>
          <circle class="ring" cx="52" cy="52" r="44" fill="none" stroke="#4A6B4F" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="{{hit.dash}}" transform="rotate(-90 52 52)"></circle>
        </svg>
        <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
          <span class="n val" style="font-size: 26px; font-weight: 600; line-height: 1;">{{hit.pct}}<span style="font-size: 13px;">%</span></span>
        </div>
      </div>
      <div style="flex-grow: 1;">
        <div style="font-size: 14px; font-weight: 500;">达标率</div>
        <div style="font-size: 12px; color: #6B655C; line-height: 1.7; margin-top: 6px;">{{hit.text}}</div>
        <div style="font-size: 11px; color: #B5AB9C; margin-top: 8px;">{{hit.note}}</div>
      </div>
    </div>
  </div>

  <!-- 三大项日均 -->
  <div style="margin: 12px 20px 0 20px; background: #FFFFFF; border: 1px solid #EFEBE4; border-radius: 18px; padding: 20px;">
    <div style="font-size: 14px; font-weight: 500; margin-bottom: 18px;">三大项日均 vs 目标</div>

    <div style="display: flex; flex-direction: column; gap: 18px;">
      <sc-for list="{{macros}}" as="m" hint-placeholder-count="3">
        <div>
          <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px;">
            <div style="display: flex; align-items: center; gap: 9px;">
              <div style="{{m.chipStyle}}"></div>
              <span style="font-size: 13px; color: #3A3630;">{{m.name}}</span>
            </div>
            <div class="n val" style="font-size: 13px;"><span style="font-weight: 600;">{{m.value}}</span><span style="color: #9A948A;"> / {{m.goal}} g</span></div>
          </div>
          <div style="position: relative; height: 7px; border-radius: 4px; background: #F2EFE9;">
            <div class="fill" style="{{m.fillStyle}}"></div>
            <div style="{{m.markStyle}}"></div>
          </div>
          <sc-if value="{{m.hasNote}}" hint-placeholder-val="{{true}}">
            <div style="font-size: 11px; color: #B0554F; margin-top: 7px;">{{m.note}}</div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- 记录习惯 -->
  <div style="margin: 12px 20px 0 20px; background: #FFFFFF; border: 1px solid #EFEBE4; border-radius: 18px; padding: 20px;">
    <div style="font-size: 14px; font-weight: 500; margin-bottom: 16px;">记录习惯</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px;">
      <div>
        <div class="n val" style="font-size: 22px; font-weight: 600;">{{habit.logged}}<span style="font-size: 12px; font-weight: 400; color: #9A948A;">/{{habit.total}}</span></div>
        <div style="font-size: 11px; color: #9A948A; margin-top: 3px;">有记录天数</div>
      </div>
      <div>
        <div class="n" style="font-size: 22px; font-weight: 600;">12</div>
        <div style="font-size: 11px; color: #9A948A; margin-top: 3px;">连续记录</div>
      </div>
      <div>
        <div class="n val" style="font-size: 22px; font-weight: 600;">{{habit.photo}}<span style="font-size: 12px; font-weight: 400; color: #9A948A;">%</span></div>
        <div style="font-size: 11px; color: #9A948A; margin-top: 3px;">拍照记录占比</div>
      </div>
    </div>
  </div>

  <div style="height: 40px;"></div>

</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { range: 7 };
  }

  renderVals() {
    const self = this;
    const st = this.state;
    const MAX = 2400;
    const H = 120;

    const WEEK = [2150, 1780, 2240, 1690, 2080, null, 1850];
    const MONTH = [
      1920, 2100, null, 1840, 2210, 1760, 2050,
      2180, 1890, 1720, null, 2240, 1980, 1860,
      2020, null, 2160, 1800, 2090, 1940, null,
      2230, 1870, 1990, 2110, 1780, null, 2150,
      1930, 2060
    ];

    const data = st.range === 7 ? WEEK : MONTH;
    const wide = st.range === 7;

    const bars = data.map(function (v) {
      if (v === null) {
        return {
          style: 'height: ' + H + 'px; border-radius: ' + (wide ? '6px' : '2px') +
            '; border: 1px dashed #DCD6CB; box-sizing: border-box;'
        };
      }
      const h = Math.round(v / MAX * H);
      return {
        style: 'height: ' + h + 'px; border-radius: ' + (wide ? '6px 6px 3px 3px' : '2px') +
          '; background: #23201C;'
      };
    });

    const LB = 'font-size: 10px; color: #9A948A; text-align: center;';
    let labels;
    if (wide) {
      labels = ['一', '二', '三', '四', '五', '六', '日'].map(function (t, i) {
        return { text: t, style: data[i] === null ? 'font-size: 10px; color: #C9C2B6; text-align: center;' : LB };
      });
    } else {
      labels = [
        { text: '8/18', style: 'font-size: 10px; color: #9A948A; text-align: left;' },
        { text: '8/27', style: LB },
        { text: '9/6', style: LB },
        { text: '9/16', style: 'font-size: 10px; color: #9A948A; text-align: right;' }
      ];
    }

    const cols = wide ? 7 : data.length;
    const gap = wide ? 9 : 3;

    const logged = data.filter(function (v) { return v !== null; }).length;
    const missing = data.length - logged;
    let sum = 0;
    data.forEach(function (v) { if (v !== null) sum += v; });

    const hitDays = st.range === 7 ? 5 : 18;
    const pct = Math.round(hitDays / logged * 100);
    const C = 2 * Math.PI * 44;

    const MACROS = st.range === 7
      ? [
          { name: '蛋白质', value: 122, goal: 131, color: '#4A6B4F', note: '日均差 9g' },
          { name: '碳水', value: 238, goal: 254, color: '#A8763E', note: '' },
          { name: '脂肪', value: 61, goal: 57, color: '#8A5A6B', note: '日均超 4g' }
        ]
      : [
          { name: '蛋白质', value: 118, goal: 131, color: '#4A6B4F', note: '日均差 13g — 蛋白是最常吃不够的一项' },
          { name: '碳水', value: 241, goal: 254, color: '#A8763E', note: '' },
          { name: '脂肪', value: 64, goal: 57, color: '#8A5A6B', note: '日均超 7g — 多来自炒菜用油' }
        ];

    const macros = MACROS.map(function (m) {
      const over = m.value > m.goal;
      const w = over ? 100 : Math.round(m.value / m.goal * 100);
      const mark = over ? Math.round(m.goal / m.value * 100) : 100;
      return {
        name: m.name,
        value: m.value,
        goal: m.goal,
        note: m.note,
        hasNote: m.note !== '',
        chipStyle: 'width: 3px; height: 14px; border-radius: 2px; background: ' + m.color + ';',
        fillStyle: 'width: ' + w + '%; height: 100%; border-radius: 4px; background: ' + m.color + ';',
        markStyle: 'position: absolute; top: -3px; left: ' + mark + '%; margin-left: -1px; width: 2px; height: 13px; border-radius: 1px; background: #23201C;'
      };
    });

    const SEG_ON = 'flex-grow: 1; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 11px; background: #FFFFFF; font-size: 13px; font-weight: 500; box-shadow: 0 1px 3px rgba(35,32,28,0.07);';
    const SEG_OFF = 'flex-grow: 1; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 11px; background: transparent; font-size: 13px; color: #6B655C;';

    return {
      seg: { d7: wide ? SEG_ON : SEG_OFF, d30: wide ? SEG_OFF : SEG_ON },
      pick7: function () { self.setState({ range: 7 }); },
      pick30: function () { self.setState({ range: 30 }); },
      bars: bars,
      labels: labels,
      gridStyle: 'position: absolute; bottom: 18px; left: 0; right: 0; height: ' + H +
        'px; display: grid; grid-template-columns: repeat(' + cols + ', minmax(0, 1fr)); gap: ' + gap + 'px; align-items: end;',
      labelGridStyle: 'position: absolute; bottom: 0; left: 0; right: 0; display: grid; grid-template-columns: repeat(' +
        labels.length + ', minmax(0, 1fr)); gap: ' + gap + 'px;',
      avgKcal: Math.round(sum / logged),
      missNote: missing === 0 ? '每天都有记录' : (missing + ' 天没有记录，不计入日均'),
      hit: {
        pct: pct,
        dash: (C * pct / 100).toFixed(0) + ' ' + C.toFixed(0),
        text: '近 ' + st.range + ' 天有记录的 ' + logged + ' 天里，' + hitDays + ' 天热量落在目标 ±10% 区间内。',
        note: '未记录的 ' + missing + ' 天不计入'
      },
      macros: macros,
      habit: {
        logged: logged,
        total: data.length,
        photo: st.range === 7 ? 83 : 78
      }
    };
  }
}
</script>
</body>
</html>
