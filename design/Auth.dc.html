<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; background: #FBFAF7; color: #23201C;
      font-family: "Noto Sans SC", system-ui, -apple-system, sans-serif;
      font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    a { color: #4A6B4F; text-decoration: none; } a:hover { color: #3A553D; }
    .n { font-family: Archivo, system-ui, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 96px 28px 40px 28px; display: flex; flex-direction: column;">

  <!-- 标识 -->
  <div style="display: flex; align-items: center; gap: 10px;">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#23201C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M12 3a9 9 0 000 18"></path>
      <path d="M7.5 12h9"></path>
    </svg>
    <span class="n" style="font-size: 19px; font-weight: 600; letter-spacing: -0.01em;">FitMeal</span>
  </div>

  <!-- 主张 -->
  <div style="margin-top: 72px;">
    <div style="font-size: 32px; font-weight: 700; line-height: 1.28; letter-spacing: -0.03em; text-wrap: pretty;">拍一张照片，<br>就记完这一餐。</div>
    <div style="font-size: 14px; color: #6B655C; line-height: 1.7; margin-top: 16px;">按你的身体数据和训练安排算出每日目标，<br>剩下的只需要举起相机。</div>
  </div>

  <!-- 表单 -->
  <div style="margin-top: 52px; display: flex; flex-direction: column; gap: 12px;">
    <div style="background: #FFFFFF; border: 1px solid #E6E2DA; border-radius: 14px; padding: 13px 16px;">
      <div style="font-size: 11px; color: #9A948A;">邮箱</div>
      <div style="font-size: 15px; margin-top: 3px;">chen@example.com</div>
    </div>
    <div style="background: #FFFFFF; border: 1.5px solid #23201C; border-radius: 14px; padding: 13px 16px;">
      <div style="font-size: 11px; color: #9A948A;">密码</div>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 3px;">
        <span class="n" style="font-size: 15px; letter-spacing: 0.22em;">••••••••</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A948A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.8-6 10-6 10 6 10 6-3.8 6-10 6-10-6-10-6z"></path><circle cx="12" cy="12" r="2.6"></circle></svg>
      </div>
    </div>
    <div style="font-size: 12px; color: #9A948A; padding-left: 4px;">至少 8 位，包含字母和数字</div>
  </div>

  <div style="margin-top: 28px;">
    <div style="height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 15px; background: #23201C; color: #FBFAF7; font-size: 15px; font-weight: 500;">创建账号</div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="text-align: center; font-size: 13px; color: #6B655C;">
    已经有账号了？<span style="color: #23201C; font-weight: 500; border-bottom: 1px solid #23201C; padding-bottom: 1px;">登录</span>
  </div>
  <div style="text-align: center; font-size: 11px; color: #B5AB9C; margin-top: 18px; line-height: 1.7;">
    创建账号即表示同意<span style="color: #6B655C;">服务条款</span>与<span style="color: #6B655C;">隐私政策</span>
  </div>

</div>
</x-dc>
</body>
</html>
