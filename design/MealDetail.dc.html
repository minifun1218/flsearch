<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; background: #FBFAF7; color: #23201C;
      font-family: "Noto Sans SC", system-ui, -apple-system, sans-serif;
      font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    a { color: #4A6B4F; text-decoration: none; } a:hover { color: #3A553D; }
    .n { font-family: Archivo, system-ui, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
    .tap { cursor: pointer; user-select: none;
      transition: background-color .18s ease, color .18s ease, border-color .18s ease, transform .09s ease; }
    .tap:active { transform: scale(0.96); }
    .val { transition: color .18s ease; }
  </style>
</helmet>

<div style="width: 390px; padding: 52px 0 0 0; box-sizing: border-box;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 20px 24px 20px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#23201C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    <span style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em;">编辑记录</span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B0554F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14"></path><path d="M9 7V5h6v2"></path><path d="M7 7l1 12h8l1-12"></path></svg>
  </div>

  <!-- 食物名 + 归属 -->
  <div style="padding: 0 20px;">
    <div style="font-size: 26px; font-weight: 600; letter-spacing: -0.02em;">香煎鸡胸肉</div>
    <div style="font-size: 13px; color: #9A948A; margin-top: 5px;">9月16日 · 午餐 · 由拍照识别添加</div>
  </div>

  <!-- 份量 -->
  <div style="margin: 26px 20px 0 20px; background: #FFFFFF; border: 1px solid #EFEBE4; border-radius: 18px; padding: 20px;">
    <div style="font-size: 13px; color: #9A948A; margin-bottom: 14px;">份量</div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div class="tap" onClick="{{dec}}" style="width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 15px; border: 1px solid #E6E2DA;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3A3630" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"></path></svg>
      </div>
      <div style="display: flex; align-items: baseline; gap: 5px;">
        <span class="n val" style="font-size: 42px; font-weight: 600; letter-spacing: -0.03em;">{{grams}}</span>
        <span style="font-size: 17px; color: #6B655C;">g</span>
      </div>
      <div class="tap" onClick="{{inc}}" style="width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 15px; border: 1px solid #E6E2DA;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3A3630" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </div>
    </div>
    <div style="display: flex; gap: 8px; margin-top: 18px;">
      <sc-for list="{{quick}}" as="q" hint-placeholder-count="4">
        <div class="tap n" onClick="{{q.pick}}" style="{{q.style}}">{{q.label}}</div>
      </sc-for>
    </div>
  </div>

  <!-- 换算结果 -->
  <div style="margin: 12px 20px 0 20px; background: #23201C; border-radius: 18px; padding: 22px 20px; color: #FBFAF7;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <span style="font-size: 13px; color: rgba(251,250,247,0.55);">这份的实际摄入</span>
      <span class="n val" style="font-size: 30px; font-weight: 600;">{{kcal}}<span style="font-size: 13px; font-weight: 400; color: rgba(251,250,247,0.55);"> kcal</span></span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 18px; padding-top: 18px; border-top: 1px solid rgba(251,250,247,0.13);">
      <div>
        <div class="n val" style="font-size: 18px; font-weight: 600;">{{p}}<span style="font-size: 11px; font-weight: 400; color: rgba(251,250,247,0.5);">g</span></div>
        <div style="font-size: 11px; color: rgba(251,250,247,0.5); margin-top: 3px;">蛋白质</div>
      </div>
      <div>
        <div class="n val" style="font-size: 18px; font-weight: 600;">{{c}}<span style="font-size: 11px; font-weight: 400; color: rgba(251,250,247,0.5);">g</span></div>
        <div style="font-size: 11px; color: rgba(251,250,247,0.5); margin-top: 3px;">碳水</div>
      </div>
      <div>
        <div class="n val" style="font-size: 18px; font-weight: 600;">{{f}}<span style="font-size: 11px; font-weight: 400; color: rgba(251,250,247,0.5);">g</span></div>
        <div style="font-size: 11px; color: rgba(251,250,247,0.5); margin-top: 3px;">脂肪</div>
      </div>
    </div>
  </div>

  <!-- 每 100g 营养值（可修正） -->
  <div style="margin: 12px 20px 0 20px; background: #FFFFFF; border: 1px solid #EFEBE4; border-radius: 18px; padding: 20px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
      <span style="font-size: 14px; font-weight: 500;">每 100g 营养值</span>
      <span style="font-size: 13px; color: #4A6B4F; font-weight: 500;">修正</span>
    </div>
    <div style="font-size: 12px; color: #9A948A; line-height: 1.6; margin-bottom: 16px;">修正后这个食物以后都按新数值计算，历史记录不受影响。</div>

    <div style="display: flex; flex-direction: column; gap: 0;">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid #F5F2EC;">
        <span style="font-size: 14px; color: #6B655C;">热量</span>
        <span class="n" style="font-size: 14px; font-weight: 500;">165 kcal</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid #F5F2EC;">
        <div style="display: flex; align-items: center; gap: 9px;">
          <div style="width: 3px; height: 14px; border-radius: 2px; background: #4A6B4F;"></div>
          <span style="font-size: 14px; color: #6B655C;">蛋白质</span>
        </div>
        <span class="n" style="font-size: 14px; font-weight: 500;">31.0 g</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid #F5F2EC;">
        <div style="display: flex; align-items: center; gap: 9px;">
          <div style="width: 3px; height: 14px; border-radius: 2px; background: #A8763E;"></div>
          <span style="font-size: 14px; color: #6B655C;">碳水</span>
        </div>
        <span class="n" style="font-size: 14px; font-weight: 500;">0 g</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid #F5F2EC;">
        <div style="display: flex; align-items: center; gap: 9px;">
          <div style="width: 3px; height: 14px; border-radius: 2px; background: #8A5A6B;"></div>
          <span style="font-size: 14px; color: #6B655C;">脂肪</span>
        </div>
        <span class="n" style="font-size: 14px; font-weight: 500;">3.6 g</span>
      </div>
    </div>
  </div>

  <!-- 收藏 -->
  <div class="tap" onClick="{{toggleFav}}" style="margin: 12px 20px 0 20px; display: flex; align-items: center; justify-content: space-between; background: #FFFFFF; border: 1px solid #EFEBE4; border-radius: 16px; padding: 16px 20px;">
    <div style="display: flex; align-items: center; gap: 11px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="{{fav.fill}}" stroke="{{fav.stroke}}" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.7l5.9-.8L12 3.5z"></path></svg>
      <span style="font-size: 14px;">{{fav.label}}</span>
    </div>
    <div style="{{fav.trackStyle}}">
      <div style="width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF;"></div>
    </div>
  </div>

  <div style="padding: 22px 20px 34px 20px;">
    <div style="height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 15px; background: #23201C; color: #FBFAF7; font-size: 15px; font-weight: 500;">保存修改</div>
  </div>

</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { g: 120, fav: true };
  }

  setG(v) { this.setState({ g: Math.max(0, v) }); }

  renderVals() {
    const self = this;
    const st = this.state;
    const PER = { kc: 165, p: 31.0, c: 0, f: 3.6 };
    const r = st.g / 100;

    const Q_ON = 'flex-grow: 1; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 11px; background: #23201C; color: #FBFAF7; font-size: 13px; font-weight: 500;';
    const Q_OFF = 'flex-grow: 1; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 11px; background: #F4F1EA; color: #6B655C; font-size: 13px;';

    const quick = [80, 120, 150, 200].map(function (v) {
      return { label: v + ' g', style: st.g === v ? Q_ON : Q_OFF, pick: function () { self.setG(v); } };
    });

    return {
      grams: st.g,
      quick: quick,
      kcal: Math.round(PER.kc * r),
      p: (PER.p * r).toFixed(1),
      c: (PER.c * r).toFixed(1),
      f: (PER.f * r).toFixed(1),
      inc: function () { self.setG(st.g + 10); },
      dec: function () { self.setG(st.g - 10); },
      fav: {
        label: st.fav ? '已加入常吃' : '加入常吃',
        fill: st.fav ? '#A8763E' : 'none',
        stroke: st.fav ? 'none' : '#B5AB9C',
        trackStyle: st.fav
          ? 'width: 44px; height: 26px; border-radius: 999px; background: #23201C; display: flex; align-items: center; justify-content: flex-end; padding: 0 3px; box-sizing: border-box; transition: background-color .2s ease;'
          : 'width: 44px; height: 26px; border-radius: 999px; background: #E6E2DA; display: flex; align-items: center; justify-content: flex-start; padding: 0 3px; box-sizing: border-box; transition: background-color .2s ease;'
      },
      toggleFav: function () { self.setState({ fav: !st.fav }); }
    };
  }
}
</script>
</body>
</html>
