<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; background: #FBFAF7; color: #23201C;
      font-family: "Noto Sans SC", system-ui, -apple-system, sans-serif;
      font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    a { color: #4A6B4F; text-decoration: none; } a:hover { color: #3A553D; }
    .n { font-family: Archivo, system-ui, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  </style>
</helmet>

<div style="width: 390px; padding: 52px 0 0 0; box-sizing: border-box;">

  <div style="padding: 0 20px 22px 20px;">
    <div style="font-size: 26px; font-weight: 700; letter-spacing: -0.025em;">我的</div>
  </div>

  <!-- 档案摘要 -->
  <div style="margin: 0 20px; background: #FFFFFF; border: 1px solid #EFEBE4; border-radius: 18px; padding: 20px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;">
      <div>
        <div style="font-size: 16px; font-weight: 600;">陈</div>
        <div style="font-size: 12px; color: #9A948A; margin-top: 2px;">chen@example.com</div>
      </div>
      <div style="padding: 7px 13px; border-radius: 10px; border: 1px solid #E6E2DA; font-size: 13px; color: #3A3630;">编辑</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding-top: 18px; border-top: 1px solid #F2EFE9;">
      <div>
        <div class="n" style="font-size: 17px; font-weight: 600;">31</div>
        <div style="font-size: 10px; color: #9A948A; margin-top: 2px;">岁</div>
      </div>
      <div>
        <div class="n" style="font-size: 17px; font-weight: 600;">175</div>
        <div style="font-size: 10px; color: #9A948A; margin-top: 2px;">cm</div>
      </div>
      <div>
        <div class="n" style="font-size: 17px; font-weight: 600;">71.2</div>
        <div style="font-size: 10px; color: #9A948A; margin-top: 2px;">kg</div>
      </div>
      <div>
        <div class="n" style="font-size: 17px; font-weight: 600;">1.55</div>
        <div style="font-size: 10px; color: #9A948A; margin-top: 2px;">活动系数</div>
      </div>
    </div>
  </div>

  <!-- 目标卡 -->
  <div style="margin: 12px 20px 0 20px; background: #FFFFFF; border: 1px solid #EFEBE4; border-radius: 18px; padding: 20px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
      <span style="font-size: 14px; font-weight: 500;">每日目标</span>
      <div style="display: flex; align-items: center; gap: 4px;">
        <span style="font-size: 13px; color: #4A6B4F;">详情</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#4A6B4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </div>
    </div>
    <div style="font-size: 12px; color: #9A948A; margin-bottom: 16px;">减脂 · 目标 68 kg · 每周 0.5 kg</div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="background: #F4F1EA; border-radius: 13px; padding: 14px 16px;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
          <div style="display: flex; align-items: center; gap: 7px;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#4A6B4F" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 12h18"></path></svg>
            <span style="font-size: 13px; font-weight: 500;">训练日</span>
            <span style="font-size: 11px; color: #9A948A;">一 三 五 六</span>
          </div>
          <span class="n" style="font-size: 16px; font-weight: 600;">2200</span>
        </div>
        <div class="n" style="font-size: 11px; color: #6B655C;">蛋白 131g · 碳水 291g · 脂肪 57g · 水 3038ml</div>
      </div>

      <div style="background: #F4F1EA; border-radius: 13px; padding: 14px 16px;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
          <div style="display: flex; align-items: center; gap: 7px;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#9A948A" stroke-width="2" stroke-linecap="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"></path><circle cx="12" cy="12" r="3.5"></circle></svg>
            <span style="font-size: 13px; font-weight: 500;">休息日</span>
            <span style="font-size: 11px; color: #9A948A;">二 四 日</span>
          </div>
          <span class="n" style="font-size: 16px; font-weight: 600;">1820</span>
        </div>
        <div class="n" style="font-size: 11px; color: #6B655C;">蛋白 131g · 碳水 196g · 脂肪 57g · 水 2538ml</div>
      </div>
    </div>
  </div>

  <!-- 设置分组 -->
  <div style="padding: 28px 20px 0 20px;">
    <div style="font-size: 12px; color: #9A948A; margin-bottom: 10px; padding-left: 4px;">记录</div>
    <div style="background: #FFFFFF; border: 1px solid #EFEBE4; border-radius: 16px; overflow: hidden;">

      <div style="display: flex; align-items: center; gap: 13px; padding: 15px 18px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#6B655C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.7l5.9-.8L12 3.5z"></path></svg>
        <span style="font-size: 15px; flex-grow: 1;">常吃食物</span>
        <span class="n" style="font-size: 13px; color: #9A948A;">24</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9C2B6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </div>

      <div style="display: flex; align-items: center; gap: 13px; padding: 15px 18px; border-top: 1px solid #F5F2EC;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#6B655C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6"></path><path d="M6 13l6 6 6-6"></path><path d="M4 4h16"></path></svg>
        <span style="font-size: 15px; flex-grow: 1;">导出记录</span>
        <span style="font-size: 13px; color: #9A948A;">CSV</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9C2B6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </div>

      <div style="display: flex; align-items: center; gap: 13px; padding: 15px 18px; border-top: 1px solid #F5F2EC;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#6B655C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 13a9 9 0 103-7.7L3 8"></path><path d="M3 4v4h4"></path></svg>
        <span style="font-size: 15px; flex-grow: 1;">同步状态</span>
        <span style="font-size: 13px; color: #4A6B4F;">刚刚已同步</span>
      </div>

    </div>
  </div>

  <div style="padding: 20px 20px 0 20px;">
    <div style="font-size: 12px; color: #9A948A; margin-bottom: 10px; padding-left: 4px;">提醒与隐私</div>
    <div style="background: #FFFFFF; border: 1px solid #EFEBE4; border-radius: 16px; overflow: hidden;">

      <div style="display: flex; align-items: center; gap: 13px; padding: 15px 18px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#6B655C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15V10a6 6 0 10-12 0v5l-1.5 3h15L18 15z"></path><path d="M10 21h4"></path></svg>
        <span style="font-size: 15px; flex-grow: 1;">提醒设置</span>
        <span style="font-size: 13px; color: #9A948A;">4 项开启</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9C2B6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </div>

      <div style="display: flex; align-items: center; gap: 13px; padding: 15px 18px; border-top: 1px solid #F5F2EC;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#6B655C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6l7-3z"></path></svg>
        <span style="font-size: 15px; flex-grow: 1;">隐私政策</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9C2B6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </div>

      <div style="display: flex; align-items: center; gap: 13px; padding: 15px 18px; border-top: 1px solid #F5F2EC;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#6B655C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 15l5-4 4 3 3-2 6 4"></path></svg>
        <div style="flex-grow: 1;">
          <div style="font-size: 15px;">照片处理</div>
          <div style="font-size: 11px; color: #9A948A; margin-top: 2px;">识别后保留 30 天，到期自动删除</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9C2B6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </div>

    </div>
  </div>

  <div style="padding: 20px 20px 0 20px;">
    <div style="background: #FFFFFF; border: 1px solid #EFEBE4; border-radius: 16px; overflow: hidden;">
      <div style="display: flex; align-items: center; gap: 13px; padding: 15px 18px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#6B655C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 16l4-4-4-4"></path><path d="M19 12H9"></path><path d="M11 4H6a2 2 0 00-2 2v12a2 2 0 002 2h5"></path></svg>
        <span style="font-size: 15px; flex-grow: 1;">退出登录</span>
      </div>
      <div style="display: flex; align-items: center; gap: 13px; padding: 15px 18px; border-top: 1px solid #F5F2EC;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#B0554F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14"></path><path d="M9 7V5h6v2"></path><path d="M7 7l1 12h8l1-12"></path></svg>
        <span style="font-size: 15px; color: #B0554F; flex-grow: 1;">注销账号</span>
      </div>
    </div>
  </div>

  <div class="n" style="text-align: center; font-size: 11px; color: #C9C2B6; padding: 28px 0 40px 0;">FitMeal 1.0.0</div>

</div>
</x-dc>
</body>
</html>
