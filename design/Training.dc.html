<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; background: #FBFAF7; color: #23201C;
      font-family: "Noto Sans SC", system-ui, -apple-system, sans-serif;
      font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    a { color: #4A6B4F; text-decoration: none; } a:hover { color: #3A553D; }
    .n { font-family: Archivo, system-ui, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
    .tap { cursor: pointer; user-select: none;
      transition: background-color .16s ease, color .16s ease, border-color .16s ease, transform .09s ease; }
    .tap:active { transform: scale(0.95); }
    .track { cursor: pointer; }
    .fill { transition: width .22s cubic-bezier(.2,.8,.2,1); }
    .knob { transition: left .22s cubic-bezier(.2,.8,.2,1); }
    .val { transition: color .18s ease; }
  </style>
</helmet>

<div style="width: 390px; padding: 52px 0 0 0; box-sizing: border-box;">

  <div style="padding: 0 28px;">
    <div style="display: flex; align-items: center; gap: 6px;">
      <div style="flex-grow: 1; height: 3px; border-radius: 2px; background: #23201C;"></div>
      <div style="flex-grow: 1; height: 3px; border-radius: 2px; background: #23201C;"></div>
      <div style="flex-grow: 1; height: 3px; border-radius: 2px; background: #E6E2DA;"></div>
    </div>
    <div class="n" style="font-size: 11px; color: #9A948A; margin-top: 10px;">2 / 3</div>
  </div>

  <div style="padding: 26px 28px 0 28px;">
    <div style="font-size: 27px; font-weight: 700; line-height: 1.32; letter-spacing: -0.025em;">你哪几天训练？</div>
    <div style="font-size: 14px; color: #6B655C; line-height: 1.65; margin-top: 10px;">训练日和休息日会分开给目标——练的那天多吃点碳水，休息那天少一些。</div>
  </div>

  <div style="padding: 32px 28px 0 28px;">
    <div style="font-size: 12px; color: #9A948A; margin-bottom: 12px;">每周训练日</div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 7px;">
      <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
        <div class="tap" onClick="{{d.toggle}}" style="{{d.boxStyle}}">
          <span style="{{d.textStyle}}">{{d.label}}</span>
          <div style="{{d.dotStyle}}"></div>
        </div>
      </sc-for>
    </div>
    <div class="n val" style="font-size: 12px; color: #6B655C; margin-top: 12px;">{{weekSummary}}</div>
    <sc-if value="{{noneSelected}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; gap: 10px; margin-top: 12px; padding: 13px 15px; border-radius: 12px; background: #F7F1EA;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A8763E" stroke-width="1.9" stroke-linecap="round" style="flex-shrink: 0; margin-top: 1px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16.2v.1"></path></svg>
        <div style="font-size: 12px; color: #6B5B49; line-height: 1.6;">一天都不练也可以，那所有日期都按休息日给目标。</div>
      </div>
    </sc-if>
  </div>

  <div style="padding: 30px 28px 0 28px;">
    <div style="font-size: 12px; color: #9A948A; margin-bottom: 10px;">主要训练类型</div>
    <div style="display: flex; flex-direction: column; gap: 9px;">

      <div class="tap" onClick="{{types.strength.pick}}" style="{{types.strength.style}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{types.strength.stroke}}" stroke-width="1.8" stroke-linecap="round" style="flex-shrink: 0;"><path d="M6.5 7v10M17.5 7v10M3 12h18M3.5 9.5v5M20.5 9.5v5"></path></svg>
        <div style="flex-grow: 1;">
          <div style="{{types.strength.nameStyle}}">力量训练</div>
          <div style="font-size: 11px; color: #9A948A; margin-top: 2px;">蛋白质目标会给得更高</div>
        </div>
        <sc-if value="{{types.strength.on}}" hint-placeholder-val="{{true}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#23201C" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"></path></svg>
        </sc-if>
      </div>

      <div class="tap" onClick="{{types.cardio.pick}}" style="{{types.cardio.style}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{types.cardio.stroke}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M3 15l3.5-4 3 2.5L14 8l3 3.5 4-5"></path></svg>
        <div style="flex-grow: 1;">
          <div style="{{types.cardio.nameStyle}}">有氧为主</div>
          <div style="font-size: 11px; color: #9A948A; margin-top: 2px;">碳水在训练日的加成更明显</div>
        </div>
        <sc-if value="{{types.cardio.on}}" hint-placeholder-val="{{false}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#23201C" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"></path></svg>
        </sc-if>
      </div>

      <div class="tap" onClick="{{types.mixed.pick}}" style="{{types.mixed.style}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{types.mixed.stroke}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="12" cy="12" r="9"></circle><path d="M12 3v18M3 12h18"></path></svg>
        <div style="flex-grow: 1;">
          <div style="{{types.mixed.nameStyle}}">力量 + 有氧</div>
          <div style="font-size: 11px; color: #9A948A; margin-top: 2px;">两者折中</div>
        </div>
        <sc-if value="{{types.mixed.on}}" hint-placeholder-val="{{false}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#23201C" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"></path></svg>
        </sc-if>
      </div>

    </div>
  </div>

  <div style="padding: 30px 28px 0 28px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px;">
      <span style="font-size: 12px; color: #9A948A;">单次训练时长</span>
      <span class="n val" style="font-size: 17px; font-weight: 600;">{{minutes}} <span style="font-size: 12px; font-weight: 400; color: #9A948A;">分钟</span></span>
    </div>
    <div class="track" onClick="{{setMinutes}}" style="position: relative; height: 26px; padding: 10px 0; margin: -10px 0;">
      <div style="position: absolute; top: 21px; left: 0; right: 0; height: 4px; border-radius: 2px; background: #EAE6DF;"></div>
      <div class="fill" style="{{minFill}}"></div>
      <div class="knob" style="{{minKnob}}"></div>
    </div>
    <div class="n" style="display: flex; justify-content: space-between; font-size: 11px; color: #B5AB9C; margin-top: 17px;">
      <span>20</span><span>120 分钟</span>
    </div>
  </div>

  <div style="margin: 30px 28px 0 28px; background: #F4F1EA; border-radius: 14px; padding: 16px 18px;">
    <div style="font-size: 13px; color: #3A3630; line-height: 1.7;">训练只用来区分训练日和休息日，<span style="color: #6B655C;">不会把运动消耗加回可吃的热量里</span>——那样容易高估，反而吃多。</div>
  </div>

  <div style="padding: 26px 28px 38px 28px; display: flex; gap: 10px;">
    <div class="tap" style="width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 15px; border: 1px solid #E6E2DA;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#23201C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </div>
    <div class="tap" style="flex-grow: 1; height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 15px; background: #23201C; color: #FBFAF7; font-size: 15px; font-weight: 500;">下一步：设定目标</div>
  </div>

</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { days: [0, 2, 4, 5], type: 'strength', minutes: 60 };
  }

  toggleDay(i) {
    const days = this.state.days;
    const next = days.indexOf(i) >= 0
      ? days.filter(function (d) { return d !== i; })
      : days.concat([i]);
    this.setState({ days: next });
  }

  renderVals() {
    const self = this;
    const st = this.state;
    const LABELS = ['一', '二', '三', '四', '五', '六', '日'];

    const DAY_ON = 'height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 13px; background: #23201C; border: 1px solid #23201C;';
    const DAY_OFF = 'height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 13px; background: #FFFFFF; border: 1px solid #E6E2DA;';

    const week = LABELS.map(function (label, i) {
      const on = st.days.indexOf(i) >= 0;
      return {
        label: label,
        boxStyle: on ? DAY_ON : DAY_OFF,
        textStyle: on ? 'font-size: 13px; font-weight: 500; color: #FBFAF7;' : 'font-size: 13px; color: #9A948A;',
        dotStyle: on
          ? 'width: 4px; height: 4px; border-radius: 50%; background: #FBFAF7;'
          : 'width: 4px; height: 4px;',
        toggle: function () { self.toggleDay(i); }
      };
    });

    const T_ON = 'display: flex; align-items: center; gap: 13px; background: #FFFFFF; border: 1.5px solid #23201C; border-radius: 14px; padding: 15px 16px;';
    const T_OFF = 'display: flex; align-items: center; gap: 13px; background: #FFFFFF; border: 1px solid #E6E2DA; border-radius: 14px; padding: 15px 16px;';

    function typeVal(key) {
      const on = st.type === key;
      return {
        on: on,
        style: on ? T_ON : T_OFF,
        stroke: on ? '#23201C' : '#9A948A',
        nameStyle: on ? 'font-size: 14px; font-weight: 500; color: #23201C;' : 'font-size: 14px; color: #6B655C;',
        pick: function () { self.setState({ type: key }); }
      };
    }

    const minPct = (st.minutes - 20) / 100 * 100;
    const nTrain = st.days.length;

    return {
      week: week,
      weekSummary: nTrain === 0
        ? '一周都是休息日'
        : ('每周 ' + nTrain + ' 天训练 · ' + (7 - nTrain) + ' 天休息'),
      noneSelected: nTrain === 0,
      types: { strength: typeVal('strength'), cardio: typeVal('cardio'), mixed: typeVal('mixed') },
      minutes: st.minutes,
      minFill: 'position: absolute; top: 21px; left: 0; width: ' + minPct.toFixed(1) + '%; height: 4px; border-radius: 2px; background: #23201C;',
      minKnob: 'position: absolute; top: 10px; left: ' + minPct.toFixed(1) + '%; margin-left: -13px; width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF; border: 2px solid #23201C; box-shadow: 0 2px 6px rgba(35,32,28,0.12); box-sizing: border-box;',
      setMinutes: function (e) {
        const box = e.currentTarget.getBoundingClientRect();
        if (!box.width) return;
        let r = (e.clientX - box.left) / box.width;
        r = Math.max(0, Math.min(1, r));
        self.setState({ minutes: Math.round((20 + r * 100) / 5) * 5 });
      }
    };
  }
}
</script>
</body>
</html>
