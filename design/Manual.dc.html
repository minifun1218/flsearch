<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; background: #FBFAF7; color: #23201C;
      font-family: "Noto Sans SC", system-ui, -apple-system, sans-serif;
      font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    a { color: #4A6B4F; text-decoration: none; } a:hover { color: #3A553D; }
    .n { font-family: Archivo, system-ui, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
    .tap { cursor: pointer; user-select: none;
      transition: background-color .18s ease, color .18s ease, border-color .18s ease, transform .09s ease; }
    .tap:active { transform: scale(0.97); }
    .row { transition: background-color .18s ease; }
  </style>
</helmet>

<div style="width: 390px; padding: 52px 0 0 0; box-sizing: border-box;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 20px 18px 20px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#23201C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    <span style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em;">添加到晚餐</span>
    <div style="width: 22px;"></div>
  </div>

  <div style="margin: 0 20px;">
    <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E6E2DA;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A948A" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5L21 21"></path></svg>
      <span style="font-size: 15px; color: #23201C;">{{query}}</span>
      <div style="width: 1.5px; height: 18px; background: #23201C; margin-left: -6px;"></div>
    </div>
  </div>

  <!-- 分段 -->
  <div style="display: flex; gap: 22px; padding: 22px 20px 0 20px; border-bottom: 1px solid #EFEBE4;">
    <div class="tap" onClick="{{tabs.search.pick}}" style="{{tabs.search.style}}">搜索结果</div>
    <div class="tap" onClick="{{tabs.fav.pick}}" style="{{tabs.fav.style}}">常吃</div>
    <div class="tap" onClick="{{tabs.recent.pick}}" style="{{tabs.recent.style}}">最近几餐</div>
  </div>

  <!-- tab 1：搜索结果 -->
  <sc-if value="{{tabs.search.on}}" hint-placeholder-val="{{true}}">
    <div>
      <div style="display: flex; flex-direction: column;">
        <sc-for list="{{results}}" as="r" hint-placeholder-count="4">
          <div class="tap row" style="display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid #F2EFE9;">
            <div style="flex-grow: 1;">
              <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 15px;">{{r.name}}</span>
                <sc-if value="{{r.fav}}" hint-placeholder-val="{{true}}">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="#A8763E" stroke="none"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.7l5.9-.8L12 3.5z"></path></svg>
                </sc-if>
              </div>
              <div class="n" style="font-size: 12px; color: #9A948A; margin-top: 3px;">{{r.per100}}</div>
            </div>
            <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #F4F1EA; flex-shrink: 0;">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#23201C" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
            </div>
          </div>
        </sc-for>
      </div>

      <div style="margin: 20px 20px 0 20px; background: #FFFFFF; border: 1px solid #EFEBE4; border-radius: 16px; padding: 18px;">
        <div style="font-size: 14px; font-weight: 500;">没有你要的？</div>
        <div style="font-size: 12px; color: #9A948A; margin-top: 5px; line-height: 1.6;">自己填一条，营养值填一次就会被记住，下次直接可选。</div>
        <div class="tap" style="height: 44px; display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 14px; border-radius: 12px; border: 1px solid #E6E2DA; font-size: 14px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#23201C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"></path><path d="M14.5 5.5l4 4L8 20H4v-4L14.5 5.5z"></path></svg>
          自定义食物
        </div>
      </div>
    </div>
  </sc-if>

  <!-- tab 2：常吃 -->
  <sc-if value="{{tabs.fav.on}}" hint-placeholder-val="{{false}}">
    <div>
      <div style="padding: 16px 20px 10px 20px; font-size: 12px; color: #9A948A;">按最近吃过排序 · 点一下直接记一份</div>
      <div style="display: flex; flex-direction: column;">
        <sc-for list="{{favourites}}" as="f" hint-placeholder-count="5">
          <div class="tap row" style="display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid #F2EFE9;">
            <div style="flex-grow: 1;">
              <div style="display: flex; align-items: baseline; gap: 9px;">
                <span style="font-size: 15px;">{{f.name}}</span>
                <span class="n" style="font-size: 12px; color: #9A948A;">{{f.portion}}</span>
              </div>
              <div class="n" style="font-size: 12px; color: #9A948A; margin-top: 3px;">{{f.detail}}</div>
            </div>
            <div style="display: flex; align-items: center; gap: 12px; flex-shrink: 0;">
              <span class="n" style="font-size: 14px; font-weight: 600;">{{f.kcal}}</span>
              <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #F4F1EA;">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#23201C" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
              </div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <!-- tab 3：最近几餐 -->
  <sc-if value="{{tabs.recent.on}}" hint-placeholder-val="{{false}}">
    <div style="padding: 18px 20px 0 20px;">
      <div style="font-size: 12px; color: #9A948A; margin-bottom: 12px;">整餐复制到晚餐 · 最近 7 天</div>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <sc-for list="{{recent}}" as="m" hint-placeholder-count="3">
          <div class="tap" style="background: #FFFFFF; border: 1px solid #EFEBE4; border-radius: 16px; padding: 15px 18px;">
            <div style="display: flex; align-items: center; justify-content: space-between;">
              <div style="flex-grow: 1;">
                <div style="display: flex; align-items: baseline; gap: 9px;">
                  <span style="font-size: 14px; font-weight: 500;">{{m.when}}</span>
                  <span class="n" style="font-size: 12px; color: #9A948A;">{{m.summary}}</span>
                </div>
                <div style="font-size: 12px; color: #9A948A; margin-top: 5px;">{{m.items}}</div>
              </div>
              <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #F4F1EA; flex-shrink: 0;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#23201C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V6a2 2 0 012-2h9"></path></svg>
              </div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <div style="height: 40px;"></div>

</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'search' };
  }

  renderVals() {
    const self = this;
    const st = this.state;

    const ON = 'padding-bottom: 11px; border-bottom: 2px solid #23201C; font-size: 14px; font-weight: 500; color: #23201C;';
    const OFF = 'padding-bottom: 11px; border-bottom: 2px solid transparent; font-size: 14px; color: #9A948A;';

    function tab(key) {
      return {
        on: st.tab === key,
        style: st.tab === key ? ON : OFF,
        pick: function () { self.setState({ tab: key }); }
      };
    }

    return {
      query: '鸡胸',
      tabs: { search: tab('search'), fav: tab('fav'), recent: tab('recent') },
      results: [
        { name: '香煎鸡胸肉', fav: true,  per100: '165 kcal / 100g · 蛋白 31.0 · 碳水 0 · 脂肪 3.6' },
        { name: '水煮鸡胸肉', fav: false, per100: '133 kcal / 100g · 蛋白 29.5 · 碳水 0 · 脂肪 1.6' },
        { name: '鸡胸肉丸',   fav: false, per100: '158 kcal / 100g · 蛋白 22.4 · 碳水 8.1 · 脂肪 4.2' },
        { name: '黑椒鸡胸意面', fav: false, per100: '187 kcal / 100g · 蛋白 12.8 · 碳水 24.6 · 脂肪 4.9' }
      ],
      favourites: [
        { name: '乳清蛋白粉', portion: '30 g', kcal: 120, detail: '蛋白 24.0 · 碳水 2.4 · 脂肪 1.5' },
        { name: '香煎鸡胸肉', portion: '120 g', kcal: 198, detail: '蛋白 37.2 · 碳水 0 · 脂肪 4.3' },
        { name: '全麦吐司',   portion: '80 g',  kcal: 212, detail: '蛋白 8.2 · 碳水 38.4 · 脂肪 2.9' },
        { name: '水煮蛋',     portion: '2 个',  kcal: 157, detail: '蛋白 13.9 · 碳水 1.2 · 脂肪 10.5' },
        { name: '无糖希腊酸奶', portion: '150 g', kcal: 89, detail: '蛋白 15.0 · 碳水 5.4 · 脂肪 0.6' },
        { name: '香蕉',       portion: '120 g', kcal: 105, detail: '蛋白 1.3 · 碳水 27.0 · 脂肪 0.4' }
      ],
      recent: [
        { when: '9月13日 晚餐', summary: '3 项 · 648 kcal', items: '糙米饭 · 清蒸鲈鱼 · 凉拌菠菜' },
        { when: '9月12日 晚餐', summary: '2 项 · 590 kcal', items: '牛肉炒河粉 · 紫菜蛋花汤' },
        { when: '9月10日 晚餐', summary: '4 项 · 702 kcal', items: '杂粮饭 · 番茄炒蛋 · 白灼虾 · 味噌汤' }
      ]
    };
  }
}
</script>
</body>
</html>
